name: Atualizar dados do Monday

on:
  schedule:
    # A cada 30 min, das 06h às 20h (horário de Brasília), todos os dias
    - cron: "*/30 9-23 * * *"
  workflow_dispatch:   # botão "Run workflow" para atualizar na hora

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar dados no Monday
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: python scripts/buscar_monday.py

      - name: Salvar se houve mudança
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dados.json
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualiza horímetros $(TZ=America/Sao_Paulo date +'%d/%m %H:%M')"
            git push
          fi
